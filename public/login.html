<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090807">
    <meta name="description" content="لوحة اللاعب لإدارة الحساب والرصيد والمركبات داخل السيرفر">
    <title>تسجيل الدخول | لوحة اللاعب</title>
    <link rel="icon" href="https://i.postimg.cc/4YLhBRm9/image.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-login">
    <div class="login-wrap">
        <div class="login-brand">
            <div class="brand-mark">
                <img src="https://i.postimg.cc/4YLhBRm9/image.png" alt="شعار السيرفر">
            </div>
            <h1>لوحة اللاعب</h1>
            <p>إدارة حسابك ورصيدك ومركباتك من مكان واحد وبواجهة آمنة</p>
        </div>

        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <p class="subtitle">أدخل بيانات حسابك في السيرفر للمتابعة</p>

            <div id="error" class="error" style="display: none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder="اسم الحساب">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="إظهار كلمة المرور">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn" id="loginBtn">دخول إلى اللوحة</button>
            </form>

            <div class="trust-row">
                <span class="trust-pill"><i class="fa-solid fa-shield-halved"></i> جلسة محمية</span>
                <span class="trust-pill"><i class="fa-solid fa-server"></i> مرتبط بالسيرفر</span>
            </div>
        </div>
        <p class="login-foot"><i class="fa-solid fa-lock"></i> بياناتك تُستخدم للتحقق من الحساب داخل اللعبة فقط</p>
    </div>

    <script>
        const passInput = document.getElementById('password');
        document.getElementById('togglePass').addEventListener('click', () => {
            const hidden = passInput.type === 'password';
            passInput.type = hidden ? 'text' : 'password';
            document.querySelector('#togglePass i').className = hidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = document.getElementById('loginBtn');
            errorDiv.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'جاري التحقق...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    signal: AbortSignal.timeout(15000)
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + (data.error || 'بيانات الدخول غير صحيحة');
                    errorDiv.style.display = 'flex';
                    btn.disabled = false;
                    btn.textContent = 'دخول إلى اللوحة';
                }
            } catch (error) {
                errorDiv.innerHTML = '<i class="fa-solid fa-wifi"></i> تعذر الاتصال بالخادم. حاول مرة أخرى.';
                errorDiv.style.display = 'flex';
                btn.disabled = false;
                btn.textContent = 'دخول إلى اللوحة';
            }
        });
    </script>
</body>
</html>
